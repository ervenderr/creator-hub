<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agents | Ervenderr</title>
<meta name="description" content="All of my AI agents, grouped by department. Copy one into Claude Code and use it.">
<style>
:root{--bg:#0e0e0e;--fg:#f4f4f4;--mute:#999;--line:#2a2a2a;--card:#171717;--accent:#f26b1d}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#111;--mute:#666;--line:#e6e6e6;--card:#fafafa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit}
nav{border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px}
nav b{font-weight:700}.dot{color:var(--accent)}
main{max-width:960px;margin:0 auto;padding:32px 16px}
h1{font-size:32px;margin:0 0 4px}.lead{color:var(--mute);margin:0 0 20px}
#q{width:100%;font:15px system-ui,sans-serif;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{background:none;border:1px solid var(--line);color:var(--fg);border-radius:999px;padding:4px 12px;font:13px system-ui,sans-serif;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:17px;margin:0}.tag{font-size:12px;color:var(--accent);font-weight:600}
.card p{margin:0;font-size:14px;color:var(--mute)}.card .g{color:var(--fg)}
.steps{font-size:12px;color:var(--mute)}
.row{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:8px 14px;font:600 13px system-ui,sans-serif;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line)}
footer{padding:14px 16px;font-size:12px;color:var(--mute);text-align:center;border-top:1px solid var(--line)}
</style>
</head>
<body>
<nav><b>Ervenderr <span class="dot">|</span> AI</b><span><a href="office.html">Virtual office</a> · <a href="/">Home</a></span></nav>
<main>
<h1>Agents</h1>
<p class="lead" id="lead">Loading…</p>
<input id="q" type="search" placeholder="Search agents…" aria-label="Search agents">
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</main>
<footer>Mine, in <a href="https://github.com/ervenderr/creator-hub/tree/main/agents" target="_blank" rel="noopener">ervenderr/creator-hub</a>. Inspired by <a href="https://github.com/msitarzewski/agency-agents" target="_blank" rel="noopener">msitarzewski/agency-agents</a> (MIT).</footer>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let all=[],rooms={},room="All";
function render(){
  const q=$("q").value.toLowerCase();
  const list=all.filter(a=>(room==="All"||a.room===room)&&(a.name+a.desc+a.role+rooms[a.room]).toLowerCase().includes(q));
  $("grid").innerHTML=list.map((a,i)=>`<div class="card"><span class="tag">${esc(rooms[a.room])}</span><h2>${esc(a.emoji)} ${esc(a.name)}</h2><p class="g">${esc(a.role)}</p><p>${esc(a.desc)}</p><div class="row"><button class="btn" data-i="${esc(a.id)}">Copy setup</button><a class="btn ghost" href="${esc(a.source)}" target="_blank" rel="noopener">View source</a></div></div>`).join("")||"<p>No match.</p>";
}
fetch("office.json").then(r=>r.json()).then(d=>{
  all=d.agents;d.rooms.forEach(r=>rooms[r.id]=r.label);
  $("lead").textContent=all.length+" agents in "+d.rooms.length+" departments. Each is a Claude Code subagent file you can copy.";
  $("chips").innerHTML=[["All","All ("+all.length+")"],...d.rooms.map(r=>[r.id,r.label+" ("+r.count+")"])].map(([id,l])=>`<button class="chip${id===room?" on":""}" data-c="${esc(id)}">${esc(l)}</button>`).join("");
  render();
});
$("q").addEventListener("input",render);
$("chips").addEventListener("click",e=>{const c=e.target.dataset.c;if(!c)return;room=c;document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on",b.dataset.c===c));render()});
$("grid").addEventListener("click",e=>{const id=e.target.dataset.i;if(!id)return;const a=all.find(x=>x.id===id);navigator.clipboard.writeText(a.setup).then(()=>{e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy setup",1500)})});
</script>
</body></html>
