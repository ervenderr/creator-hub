<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Office | Ervenderr</title>
<meta name="description" content="A virtual office where 42 AI agents work by department. Click a room to meet the team.">
<style>
:root{--bg:#0e0e0e;--fg:#f4f4f4;--mute:#999;--line:#2a2a2a;--card:#171717;--accent:#f26b1d}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#111;--mute:#666;--line:#e6e6e6;--card:#fafafa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit}
nav{border-bottom:1px solid var(--line);height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px}
nav b{font-weight:700}.dot{color:var(--accent)}
.office{position:relative;height:calc(100vh - 56px - 41px);min-height:480px;overflow:hidden}
#stage{position:absolute;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;white-space:nowrap;font:600 12px system-ui,sans-serif;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;box-shadow:0 2px 8px #0002}
.bubble{position:absolute;transform:translate(-50%,-110%);max-width:200px;background:#fff;color:#111;font:500 12px/1.3 system-ui,sans-serif;border-radius:10px;padding:6px 9px;box-shadow:0 3px 12px #0004;animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
@media(prefers-reduced-motion:reduce){.bubble{animation:none}}
.tag small{color:var(--mute);font-weight:500}
.tag.me{border-color:var(--accent);color:var(--accent)}
.tag:hover,.tag.on{border-color:var(--accent)}
.panel{position:absolute;left:12px;top:12px;width:230px;max-height:calc(100% - 24px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 30px #0002}
.panel h1{font-size:16px;margin:0 0 2px}.panel p{margin:0 0 10px;font-size:13px;color:var(--mute)}
.panel button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;font:14px system-ui,-apple-system,sans-serif;color:inherit;cursor:pointer}
.panel button:hover,.panel button.on{background:var(--card)}
.panel .sw{width:10px;height:10px;border-radius:3px;flex:none}.panel .n{margin-left:auto;color:var(--mute);font-size:13px}
#back{position:absolute;right:12px;top:12px;display:none}
#back.show{display:block}
.btn{background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:10px 16px;font:600 14px system-ui,-apple-system,sans-serif;cursor:pointer}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:13px;color:var(--mute);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.panel p.live{color:var(--accent);font-size:12px;min-height:18px;margin:-6px 0 8px}
#q{width:100%;font:14px system-ui,-apple-system,sans-serif;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:8px}
.panel .rh{font-size:12px;color:var(--mute);padding:4px 8px}
.panel .back{color:var(--accent);font-weight:600}
#tip{position:absolute;pointer-events:none;display:none;transform:translate(12px,-120%);background:var(--fg);color:var(--bg);font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px;white-space:nowrap;z-index:2}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line);text-decoration:none;display:inline-block}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);max-width:600px;width:calc(100% - 32px);padding:24px}
dialog::backdrop{background:#0008}dialog h2{margin:0 0 2px;font-size:22px}
dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:13px}
.small{font-size:13px;color:var(--mute);margin:0 0 8px}.role{font-weight:600;margin:8px 0}
footer{padding:10px 16px;font-size:12px;color:var(--mute);text-align:center;border-top:1px solid var(--line)}
@media(max-width:700px){
  .office{height:auto;min-height:0}#stage,.tags,#hint,#back{display:none}
  .panel{position:static;width:auto;max-height:none;border:0;box-shadow:none}
}
</style>
</head>
<body>
<nav><b>Ervenderr <span class="dot">|</span> AI</b><a href="/">← Back to home</a></nav>
<div class="office">
  <div id="stage"></div>
  <div class="tags" id="tags"></div>
  <div class="panel"><h1>Agent Office</h1><p id="sub">Loading the building…</p><p id="live" class="live" aria-live="off"></p>
    <input id="q" type="search" placeholder="Search agents…" aria-label="Search agents"><div id="rooms"></div><div id="results" hidden></div></div>
  <div id="tip"></div>
  <button class="btn" id="back">← Whole office</button>
  <div id="hint">Drag to turn · scroll to zoom · click a room or an agent</div>
</div>
<dialog id="card"><h2 id="cName"></h2><p class="small" id="cMeta"></p><p class="role" id="cRole"></p><p id="cDesc"></p><pre id="cSetup"></pre>
<p><button class="btn" id="cCopy">Copy setup</button> <a class="btn ghost" id="cSrc" target="_blank" rel="noopener">View source</a> <button class="btn ghost" id="cClose">Close</button></p></dialog>
<footer>Agents are my own, in <a href="https://github.com/ervenderr/creator-hub/tree/main/agents" target="_blank" rel="noopener">ervenderr/creator-hub</a>, inspired by <a href="https://github.com/msitarzewski/agency-agents" target="_blank" rel="noopener">msitarzewski/agency-agents</a> (MIT).</footer>
<script type="module" src="office.js"></script>
</body></html>
